name: Qualify and publish signed rc8
on:
  push:
    branches: ['codex/rc8-release-verification']
permissions:
  contents: read
  actions: read
env:
  RC8_COMMIT: 9d6f56de084082351c37646e581d134e68e6672a
  RC8_BUILD_RUN: '42786814754'
jobs:
  qualify:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        source: ['1.0.0rc4', '1.0.0rc5', '1.0.0rc6', '1.0.0rc7']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.7'
      - run: uv sync --frozen --python 3.13
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.RC8_BUILD_RUN }}
          name: WorkThread-windows-candidate
          github-token: ${{ github.token }}
          path: artifacts
      - name: Upgrade original Windows installation and compare both workspaces
        run: uv run --frozen python scripts/qualify_release_update.py --from-version "${{ matrix.source }}" --candidate artifacts/WorkThread-1.0.0rc8-windows-x64.zip --metadata qualification --commit $env:RC8_COMMIT
  publish:
    needs: qualify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.RC8_BUILD_RUN }}
          name: WorkThread-windows-candidate
          github-token: ${{ github.token }}
          path: assets
      - name: Verify signed identity and publish the four update assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v1.0.0rc8
          name=WorkThread-1.0.0rc8-windows-x64.zip
          cp qualification/update.{json,sig} assets/
          cd assets
          sha="$(sha256sum "$name" | cut -d' ' -f1)"
          sha256sum -c "$name.sha256"
          jq -e --arg sha "$sha" --arg commit "$RC8_COMMIT" '.sha256 == $sha and .commit_sha == $commit and .version == "1.0.0rc8"' update.json
          printf '%s\n' '邮件拉取现在会立即返回任务编号。工作台运行期间，关闭网页后仍会继续拉取，重新打开可查看进度。遇到短暂数据库占用会自动重试，中断后可继续拉取尚未归档的邮件。' '官方 rc4、rc5、rc6、rc7 可在「设置与运行状态 → 软件更新」保留数据升级。' '' "Windows 程序 ZIP SHA-256: $sha" > notes.md
          gh release create "$tag" "$name" "$name.sha256" update.json update.sig --draft --prerelease --target "$RC8_COMMIT" --title 'WorkThread 1.0.0rc8 · 后台邮件拉取与断点续传' --notes-file notes.md
          gh release edit "$tag" --draft=false
  public-web-update:
    needs: publish
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        source: ['1.0.0rc4', '1.0.0rc5', '1.0.0rc6', '1.0.0rc7']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.7'
      - run: uv sync --frozen --python 3.13
      - name: Update via public release in Chromium and verify retained data
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'browser'
          npm install --prefix $deps --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:WT_QA_PLAYWRIGHT = Join-Path $deps 'node_modules/playwright-core'
          $env:WT_QA_CHROME = Join-Path $env:ProgramFiles 'Google/Chrome/Application/chrome.exe'
          uv run --frozen python scripts/qualify_release_update.py --from-version "${{ matrix.source }}" --commit $env:RC8_COMMIT
