name: Qualify and publish signed rc9
on:
  push:
    branches: ['codex/rc9-release-verification']
permissions:
  contents: read
  actions: read
env:
  RC9_COMMIT: 49381b86143bbe5ce48b4f47c6d05880927b1b48
  RC9_BUILD_RUN: '42943869791'
jobs:
  qualify:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        source: ['1.0.0rc4', '1.0.0rc5', '1.0.0rc6', '1.0.0rc7', '1.0.0rc8']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.7'
      - run: uv sync --frozen --python 3.13
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.RC9_BUILD_RUN }}
          name: WorkThread-windows-candidate
          github-token: ${{ github.token }}
          path: artifacts
      - name: Upgrade original Windows installation and compare both workspaces
        run: uv run --frozen python scripts/qualify_release_update.py --from-version "${{ matrix.source }}" --candidate artifacts/WorkThread-1.0.0rc9-windows-x64.zip --metadata qualification --commit $env:RC9_COMMIT
  publish:
    needs: qualify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.RC9_BUILD_RUN }}
          name: WorkThread-windows-candidate
          github-token: ${{ github.token }}
          path: assets
      - name: Verify signed identity and publish the four update assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v1.0.0rc9
          name=WorkThread-1.0.0rc9-windows-x64.zip
          cp qualification/update.{json,sig} assets/
          cd assets
          sha="$(sha256sum "$name" | cut -d' ' -f1)"
          sha256sum -c "$name.sha256"
          jq -e --arg sha "$sha" --arg commit "$RC9_COMMIT" '.sha256 == $sha and .commit_sha == $commit and .version == "1.0.0rc9"' update.json
          printf '%s\n' '新增工作空间单实例保护，重复启动打开已有工作台，避免重复后台任务。包含 rc8 的后台邮件拉取、进度查询及断点续传。邮件拉取和更新失败现在显示具体阶段、可识别原因与处理建议；更新失败记录刷新或重启后仍可查看，未知异常提供诊断编号。' '官方 rc4、rc5、rc6、rc7、rc8 可在「设置与运行状态 → 软件更新」保留数据升级。' 'rc7 可直接升级至 rc9，无需先安装 rc8。Windows Server 2022 自动化验证通过，Windows 10/11 桌面验收待安排。' '' "Windows 程序 ZIP SHA-256: $sha" > notes.md
          gh release create "$tag" "$name" "$name.sha256" update.json update.sig --draft --prerelease --target "$RC9_COMMIT" --title 'WorkThread 1.0.0rc9 · 单实例启动、错误诊断与直接升级' --notes-file notes.md
          gh release edit "$tag" --draft=false
  public-web-update:
    needs: publish
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        source: ['1.0.0rc4', '1.0.0rc5', '1.0.0rc6', '1.0.0rc7', '1.0.0rc8']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.7'
      - run: uv sync --frozen --python 3.13
      - name: Update via public release in Chromium and verify retained data
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'browser'
          npm install --prefix $deps --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:WT_QA_PLAYWRIGHT = Join-Path $deps 'node_modules/playwright-core'
          $env:WT_QA_CHROME = Join-Path $env:ProgramFiles 'Google/Chrome/Application/chrome.exe'
          uv run --frozen python scripts/qualify_release_update.py --from-version "${{ matrix.source }}" --commit $env:RC9_COMMIT
